name: Build macOS

# Builds UNSIGNED macOS apps (.dmg + .zip). Each architecture is built on a
# NATIVE runner so the better-sqlite3 native module matches the target arch
# (cross-compiling it produced an x86_64 binary in an arm64 app, crashing on
# Apple Silicon). Trigger from the Actions tab, or by pushing a tag like v0.1.7.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (arm64)
            arch: arm64
          - os: macos-13 # Intel (x86_64)
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # postinstall runs electron-rebuild, compiling better-sqlite3 for this
      # runner's native arch (= the target arch, since the runner matches it).
      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package macOS app (unsigned)
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBCompanion-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
