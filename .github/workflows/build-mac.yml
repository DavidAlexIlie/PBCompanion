name: Build macOS

# Builds an UNSIGNED macOS app (.dmg + .zip) on a real macOS runner, since
# electron-builder --mac cannot run on Windows. Trigger it by hand from the
# Actions tab, or by pushing a tag like v0.1.7.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # postinstall runs electron-rebuild, compiling better-sqlite3 for macOS.
      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      # Native modules must match each target arch. npmRebuild is off, so we
      # rebuild better-sqlite3 for the exact arch right before packaging it.
      - name: Package macOS (arm64)
        run: |
          npx electron-rebuild --arch arm64 -f -w better-sqlite3
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package macOS (x64)
        run: |
          npx electron-rebuild --arch x64 -f -w better-sqlite3
          npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBCompanion-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
