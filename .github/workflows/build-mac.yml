name: Build macOS

# Builds an UNSIGNED macOS app (.dmg + .zip) on a real macOS runner, since
# electron-builder --mac cannot run on Windows. Trigger it by hand from the
# Actions tab, or by pushing a tag like v0.1.7.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # postinstall runs electron-rebuild, compiling better-sqlite3 for macOS.
      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package macOS app (unsigned)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # do not try to sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBCompanion-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
